[project]
name = "college-project"
version = "0.1.0"
description = "CodeMind - an AI pipeline that generates runnable full-stack projects."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.8",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "langchain>=1.4.9",
    "langchain-core>=1.7.6",
    "langchain-community>=0.4.2",
    "langchain-cerebras>=0.8.2",
    "langchain-fireworks>=1.7.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-mistralai>=1.1.6",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.20",
    "openai>=3.46.0",
    "numpy>=2.5.4",
    "json-repair>=0.64.5",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[project.optional-dependencies]
# Optional features are imported lazily by the app. Install with:
#   uv sync --extra full
full = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.3.0",
    "playwright>=1.40.0",
    "ddgs>=9.0.0",
]

[tool.uv]
# Pin the interpreter range used when resolving the lock file.
# Python 3.12/3.13 is recommended; 3.14 works but emits a pydantic V1 warning.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
